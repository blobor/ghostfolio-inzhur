version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    nolintlint:
      # Each nolint comment must name the linter and give the reason.
      require-specific: true
      require-explanation: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blobor/ghostfolio-inzhur
