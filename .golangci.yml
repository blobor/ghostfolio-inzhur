version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam

  settings:
    gosec:
      excludes:
        # Names of environment variables look like credentials to this rule.
        # Gitleaks examines the repository for real secrets.
        - G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blobor/ghostfolio-inzhur
